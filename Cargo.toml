[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/rickyb82/remotecraft"

[workspace.dependencies]
remotecraft-core = { path = "crates/core", version = "0.1.0" }
remotecraft-engine = { path = "crates/engine", version = "0.1.0" }
remotecraft-mcp = { path = "crates/mcp", version = "0.1.0" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
ureq = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
