# RemoteCraft: RustDesk Server OSS (hbbs + hbbr) and the support desk, in one container.
#
#   echo "REMOTECRAFT_TOKEN=$(openssl rand -hex 32)" >> .env      # once: a new random token
#   echo "RUSTDESK_HOST=rustdesk.siriustec.it" >> .env
#   docker compose up -d
#
# ./data keeps the RustDesk key pair, as in the previous setup: existing clients keep working
# (owned by uid 10002, the user running hbbs and hbbr).
# ./desk keeps customers, PCs, interventions, the GDPR record and the audit log (owned by uid
# 10001, the user running the desk API).
# Back up both directories.

services:
  remotecraft:
    build:
      context: .
      args:
        RUSTDESK_TAG: ${RUSTDESK_TAG:-1.1.16}
    image: remotecraft
    container_name: remotecraft
    restart: unless-stopped
    ports:
      - "21115:21115"           # TCP: NAT type test
      - "21116:21116"           # TCP: ID registration and connections
      - "21116:21116/udp"       # UDP: ID registration, heartbeat, direct connections
      - "21117:21117"           # TCP: relay, when the direct connection fails
      - "127.0.0.1:7979:7979"   # the desk API and web app: only for the framework / reverse proxy on this machine
    environment:
      REMOTECRAFT_TOKEN: ${REMOTECRAFT_TOKEN:?set the service token for the desk API (openssl rand -hex 32)}
      RUSTDESK_HOST: ${RUSTDESK_HOST:-}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - ./data:/data/rustdesk
      - ./desk:/data/desk
